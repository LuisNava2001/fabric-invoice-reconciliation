name: Full-volume run

# Manual: the default dataset (2 batches x 5,000 base invoices, seed 4242), every validation check,
# and a drift check of the committed demo/data.js against a fresh run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-volume:
    name: default run + demo drift check (Python 3.11, Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-spark-4.2.0-${{ runner.os }}
      - run: python -m pip install -e ".[dev]"
      - name: Default run from scratch and demo drift check
        shell: bash
        run: |
          python -m invoice_recon generate-data
          python -m invoice_recon run
          python -m invoice_recon demo --check
